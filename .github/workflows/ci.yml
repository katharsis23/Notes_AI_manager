name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keeps Python/pytest output unbuffered and deterministic.
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.9"

      - name: ruff check
        run: ruff check . --output-format=github

      - name: ruff format (check only)
        run: ruff format --check .

  # ---------------------------------------------------------------------------
  # Test
  # ---------------------------------------------------------------------------
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        # --reruns provides flaky-test resilience at the pytest level; the
        # second attempt below covers whole-run nondeterminism.
        run: |
          pytest -q --cov --cov-report=xml --cov-report=term-missing
        continue-on-error: true
        id: test_first

      - name: Retry full suite once if it failed (flaky guard)
        if: steps.test_first.outcome == 'failure'
        run: |
          echo "::warning::First test run failed; retrying once to rule out flakiness."
          pytest -q --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Build (Docker image)
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: obsidian-ai-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image (imports + version)
        run: |
          docker run --rm --entrypoint python3 obsidian-ai-app:ci -c "import config.config, ai.notes.note_pipeline; print('imports ok')"
